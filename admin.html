<div id="chat-overlay" onclick="closeChat()" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:4000;display:none;backdrop-filter:blur(4px);"></div>
<div id="chat-window" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.92);width:460px;max-width:95vw;background:#0F0500;border:1px solid rgba(212,160,23,0.3);border-radius:12px;z-index:4001;display:none;flex-direction:column;transition:transform 0.25s,opacity 0.25s;opacity:0;box-shadow:0 30px 80px rgba(0,0,0,0.8);">
  <div style="padding:18px 20px;border-bottom:1px solid rgba(212,160,23,0.15);display:flex;justify-content:space-between;align-items:center;">
    <div><div style="font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:#D4A017;letter-spacing:2px;" id="chat-name">Message Customer</div><div style="font-size:0.75rem;color:#B8A99A;margin-top:2px;" id="chat-ref">Order ref</div></div>
    <button onclick="closeChat()" style="background:transparent;border:1px solid rgba(212,160,23,0.2);color:#B8A99A;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;">x</button>
  </div>
  <div id="chat-history" style="padding:15px;max-height:260px;min-height:60px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;"></div>
  <div style="padding:15px;border-top:1px solid rgba(212,160,23,0.1);">
    <textarea id="chat-msg" rows="3" placeholder="Type your message..." style="width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(212,160,23,0.2);color:#FAF0E6;padding:12px 14px;border-radius:6px;font-family:'Jost',sans-serif;font-size:0.9rem;outline:none;resize:none;margin-bottom:10px;line-height:1.5;box-sizing:border-box;"></textarea>
    <div style="display:flex;gap:10px;">
      <button id="chat-send" onclick="sendChat()" style="flex:1;padding:12px;border-radius:6px;border:none;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;cursor:pointer;color:white;background:linear-gradient(135deg,#25D366,#128C7E);">SEND MESSAGE</button>
      <button onclick="closeChat()" style="padding:12px 16px;border-radius:6px;border:1px solid rgba(212,160,23,0.2);background:transparent;color:#B8A99A;font-family:'Jost',sans-serif;font-size:0.85rem;cursor:pointer;">Cancel</button>
    </div>
    <div style="text-align:center;font-size:0.7rem;color:#B8A99A;margin-top:8px;" id="chat-note">Opens in WhatsApp - dashboard stays open</div>
  </div>
</div>
<script>
var chatOId=null;
var SMSGS={
  accepted:"Hi {n}! Your order {r} has been accepted. We are getting ready to cook your tacos!",
  prepping:"Hi {n}! Order {r} is being prepared now. Fresh ingredients, real Mexican flavour!",
  cooking:"Hi {n}! Order {r} is cooking right now. It smells incredible in here!",
  dispatched:"Hi {n}! Great news - order {r} is on its way to you! Driver will contact you shortly.",
  delivered:"Hi {n}! Hope you love your tacos! Order {r} has been delivered. Thank you so much!"
};
function openChat(oid){
  var o=allO.find(function(x){return x.id===oid;});
  if(!o)return;
  chatOId=oid;
  var cm=o.contact_method||'whatsapp';
  document.getElementById('chat-name').textContent=o.customer_name||'Customer';
  document.getElementById('chat-ref').textContent=(o.order_ref||'')+' - '+(o.customer_phone||'')+' - '+cm.toUpperCase();
  var sb=document.getElementById('chat-send');
  sb.style.background=cm==='zalo'?'linear-gradient(135deg,#0068FF,#0052CC)':'linear-gradient(135deg,#25D366,#128C7E)';
  document.getElementById('chat-note').textContent='Opens in '+(cm==='zalo'?'Zalo':'WhatsApp')+' - dashboard stays open';
  document.getElementById('chat-msg').value='';
  renderCH(o);
  showCW();
}
function openChatAuto(oid,ns){
  var o=allO.find(function(x){return x.id===oid;});
  if(!o)return;
  var tpl=SMSGS[ns];
  if(!tpl)return;
  var msg=tpl.replace('{n}',o.customer_name||'friend').replace('{r}',o.order_ref||'');
  chatOId=oid;
  var cm=o.contact_method||'whatsapp';
  document.getElementById('chat-name').textContent=o.customer_name||'Customer';
  document.getElementById('chat-ref').textContent=(o.order_ref||'')+' - '+ns.toUpperCase()+' - tap SEND to notify';
  var sb=document.getElementById('chat-send');
  sb.style.background=cm==='zalo'?'linear-gradient(135deg,#0068FF,#0052CC)':'linear-gradient(135deg,#25D366,#128C7E)';
  document.getElementById('chat-note').textContent='Opens in '+(cm==='zalo'?'Zalo':'WhatsApp')+' - dashboard stays open';
  document.getElementById('chat-msg').value=msg;
  renderCH(o);
  showCW();
}
function showCW(){
  var ov=document.getElementById('chat-overlay');
  var cw=document.getElementById('chat-window');
  ov.style.display='block';
  cw.style.display='flex';
  setTimeout(function(){cw.style.transform='translate(-50%,-50%) scale(1)';cw.style.opacity='1';},10);
}
function renderCH(o){
  var log=o.chat_log?(typeof o.chat_log==='string'?JSON.parse(o.chat_log):o.chat_log):[];
  var con=document.getElementById('chat-history');
  if(!log.length){con.innerHTML='<div style="color:#B8A99A;font-size:0.8rem;text-align:center;padding:15px;">No messages yet</div>';return;}
  con.innerHTML=log.map(function(m){
    var own=m.from==='owner';
    return '<div style="display:flex;justify-content:'+(own?'flex-end':'flex-start')+';">'+'<div style="max-width:82%;background:'+(own?'linear-gradient(135deg,#D4A017,#E67E22)':'rgba(255,255,255,0.07)')+';color:'+(own?'#0F0500':'#FAF0E6')+';padding:9px 13px;border-radius:'+(own?'12px 12px 2px 12px':'12px 12px 12px 2px')+';font-size:0.85rem;line-height:1.5;">'+'<div>'+m.text+'</div><div style="font-size:0.65rem;opacity:0.6;margin-top:3px;text-align:right;">'+m.time+'</div></div></div>';
  }).join('');
  con.scrollTop=con.scrollHeight;
}
function sendChat(){
  var msg=document.getElementById('chat-msg').value.trim();
  if(!msg||!chatOId)return;
  var o=allO.find(function(x){return x.id===chatOId;});
  if(!o)return;
  var cm=o.contact_method||'whatsapp';
  var ph=(o.customer_phone||'').replace(/[^0-9+]/g,'');
  if(ph.startsWith('0'))ph='+84'+ph.substring(1);
  var url=cm==='zalo'?('https://zalo.me/'+ph.replace('+','')):('https://wa.me/'+ph.replace('+','')+'/send?text='+encodeURIComponent(msg));
  var win=window.open(url,'_blank');
  var now=new Date();
  var t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var log=o.chat_log?(typeof o.chat_log==='string'?JSON.parse(o.chat_log):o.chat_log):[];
  log.push({from:'owner',text:msg,time:t});
  sbF('/rest/v1/orders?id=eq.'+chatOId,{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({chat_log:log})}).then(function(){loadO();renderCH(Object.assign({},o,{chat_log:log}));});
  document.getElementById('chat-msg').value='';
  if(win)setTimeout(function(){try{win.close();}catch(e){}},4000);
}
function closeChat(){
  var cw=document.getElementById('chat-window');
  var ov=document.getElementById('chat-overlay');
  cw.style.transform='translate(-50%,-50%) scale(0.92)';
  cw.style.opacity='0';
  setTimeout(function(){cw.style.display='none';ov.style.display='none';},220);
  chatOId=null;
}
</script>
